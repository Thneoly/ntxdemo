[package]
name = "ntx-registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# Enable schema validation using jsonschema
validate = ["dep:jsonschema"]
http = ["dep:reqwest"]

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls-webpki-roots", "multipart"] }
bytes = "1"
url = "2"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros"] }
jsonschema = { version = "0.17", optional = true }
# wasmtime integration is deferred; keep commented for future use
# wasmtime = { version = "28", optional = true, default-features = false, features = ["component-model"] }
log = "0.4"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
assert_matches = "1"
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
