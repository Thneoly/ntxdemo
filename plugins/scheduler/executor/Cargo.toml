[package]
name = "scheduler-executor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]  # Component mode

[dependencies]
anyhow = "1.0"
wit-bindgen = { version = "0.48", features = ["realloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
scheduler-core = { path = "../core-libs" }

[package.metadata.component]
package = "scheduler:executor"
