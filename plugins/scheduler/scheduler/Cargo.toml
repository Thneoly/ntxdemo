[package]
name = "scheduler"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "http_server"
path = "src/bin/http_server.rs"
required-features = ["http_server_bin"]

[features]
default = ["http_server_bin"]
http_server_bin = ["dep:axum", "dep:tokio"]

[package.metadata.component]
package = "scheduler:main"

[package.metadata.component.target]
path = "wit"
world = "scheduler-component"

[dependencies]
anyhow = "1.0"
indexmap = { version = "2.6", features = ["serde"] }
serde_json = "1.0"
serde_yaml = "0.9.34-deprecated"
serde = { version = "1.0", features = ["derive"] }
wit-bindgen = { version = "0.48", features = ["realloc"] }
thiserror = "1.0"
axum = { version = "0.7", features = ["json"], optional = true }
tokio = { version = "1.39", features = ["full"], optional = true }


