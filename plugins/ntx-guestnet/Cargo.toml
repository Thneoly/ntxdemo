[package]
name = "ntx-guestnet"
version = "0.1.0"
edition = "2024"

doctest = false

[lib]
crate-type = ["rlib"]

test = true

[dependencies]
thiserror = "2.0.17"
# IMPORTANT: guestnet is a `wasm32-wasip2` component. Keep this dependency
# wasm-safe by disabling default features (which include `host`) and enabling
# only the `guestnet` feature (no libc / AF_PACKET).
ntx-network = { path = "../../network", default-features = false, features = ["guestnet"] }

[dev-dependencies]
# kept minimal; tests currently use only std + ntx-network

