[package]
name = "actions-catalog-gen"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "39.0.1", features = ["component-model-async"] }
wasmtime-wasi = "39.0.1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

