[package]
name = "actions-executor-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
anyhow = "1.0"
wit-bindgen = { version = "0.49.0", features = ["realloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
ntx-action-sdk = { git = "https://github.com/Thneoly/ntxdemo.git", tag = "v0.0.1", features = ["core-types-adapter"] }

[package.metadata.component]
package = "ntx:scenario-actions-executor@0.1.0"

[package.metadata.component.target]
path = "wit/deps"
world = "action-executor-component"

# When this template is generated into `component/<name>`, it sits under the repo's
# workspace root. Adding an empty `[workspace]` makes the generated crate buildable
# via `--manifest-path` without requiring edits to the root workspace manifest.
[workspace]
