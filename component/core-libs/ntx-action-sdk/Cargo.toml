[package]
name = "ntx-action-sdk"
version = "0.1.0"
edition = "2021"

[features]
# Optional adapters that depend on workspace WIT-generated/core-types crates.
# Keep the default feature set dependency-light for generic reuse.
core-types-adapter = ["dep:wit-bindgen"]

[lib]
# normal Rust lib; used by WASI components too
crate-type = ["rlib"]

doctest = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"

# Optional dependency used only for binding-friendly adapter helpers.
wit-bindgen = { version = "0.49.0", optional = true }

# No direct dependency on `wit-bindgen` here; this crate is pure Rust helpers.
