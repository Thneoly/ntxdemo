[package]
name = "actions-executor-template"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
anyhow = "1.0"
wit-bindgen = { version = "0.49.0", features = ["realloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ntx-action-sdk = { path = "../../core-libs/ntx-action-sdk" }

[package.metadata.component]
package = "ntx:scenario-actions-executor@0.1.0"

[package.metadata.component.target]
path = "../../wit"
world = "action-executor-component"
