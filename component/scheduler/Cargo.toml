[package]
name = "component-scheduler"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
wit-bindgen = { version = "0.49.0", features = ["realloc"] }
once_cell = "1.21"

[package.metadata.component]
package = "ntx:scenario-scheduler@0.1.0"

[package.metadata.component.target]
path = "../wit"
world = "scheduler-main"

