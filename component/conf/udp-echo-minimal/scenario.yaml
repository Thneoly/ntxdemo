version: "v1"
name: "udp-echo-minimal"

workbook:
  resources:
    - id: "udp-target"
      type: "udp-endpoint"
      properties:
        # 对端地址
        peer_ip: "10.0.0.2"
        peer_port: 7
        # peer_mac 可选：
        # - 如果 host 侧 ARP cache 已有条目，scheduler 会调用 resources.resolve-peer-mac(peer_ip) 自动解析
        # - 如果没有条目，会返回 not-found；此时请显式填写 peer_mac
        peer_mac: "02:00:00:00:00:a2"
        # 可选：从哪个资源池分配 local ip/mac/udp-port（默认 "default"）
        pool: "default"

actions:
  actions:
    - id: "udp-send-reply"
      call: "udp.send-reply"
      with:
        payload: "hello-ntx"
        # 可选：超时与重试（毫秒）
        timeout-ms: 3000
        retry:
          max: 0
          backoff_ms: 500

workflows:
  nodes:
    - id: "start"
      type: "action"
      priority: 10
      action: "udp-send-reply"
      edges:
        - to: "wait-echo"
          label: "sent"

    - id: "wait-echo"
      type: "wait"
      on:
        event: "packet.rx"
        match:
          action_id: "udp-send-reply"
      edges:
        - to: "end"
          label: "echo-ok"

    - id: "end"
      type: "end"

load:
  ramp_up:
    phases:
      - at_second: 0
        spawn_users: 1
  user_lifetime:
    mode: "once"
    # P4：每 user 并发上限（Running task 数）
    max_concurrency: 1

user_resources:
  ip_binding:
    enabled: true
    # host resources 的 pool 名称（一般就是 "default"）
    pool_id: "default"


