version: "v1"

name: "workflow-demo"

workbook:
  resources:
    -
      id: "udp-target"
      type: "udp-endpoint"
      properties:
        peer_ip: "10.0.0.2"
        peer_mac: "02:00:00:00:00:a2"
        peer_port: 7
        pool: "default"

load:
  ramp_up:
    phases:
      -
        at_second: 1
        spawn_users: 1
      -
        at_second: 5
        spawn_users: 1
  user_lifetime:
    mode: "once"
    max_concurrency: 1

user_resources:
  ip_binding:
    enabled: true
    pool_id: "default"

actions:
  actions:
    -
      id: "udp-send-reply"
      call: "udp-send-reply"
      with:
        payload: "hello"
        timeout_ms: 1000

workflows:
  nodes:
    -
      id: "action-udp-send-reply"
      type: "action"
      priority: 10
      action: "udp-send-reply"
      edges:
        -
          to: "wait-packet-rx"
    -
      id: "wait-packet-rx"
      type: "wait"
      on:
        event: "packet-rx"
        match:
          action_id: "udp-send-reply"
      edges:
        -
          to: "end"
    -
      id: "end"
      type: "end"
