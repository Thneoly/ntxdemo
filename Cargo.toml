[package]
name = "Ntx"
version = "0.1.0"
edition = "2024"

[lib]
name = "ntx"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
libc = "0.2" # Adding libc for AF_PACKET raw socket and ioctl bindings
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
wasmtime = "39.0.1"
wasmtime-wasi = "39.0.1"
wit-bindgen = "0.49.0"
