[package]
name = "ntx"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
	".",
	"network",
	"plugins/packet-engine",
	"component/scheduler",
	"component/actions-executor",
	"component/eventbus",
	"component/core-libs/ntx-action-sdk",
	"crates/actions-catalog-gen",
	"crates/ntx-backend",
	"crates/ntx-wac-compose",
]

# Templates are used via `cargo-generate` and may contain placeholders that are
# not valid Cargo manifests inside the workspace.
exclude = [
	"component/actions-executor-template/*",
]

[lib]
name = "ntx"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2" # Adding libc for AF_PACKET raw socket and ioctl bindings
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34-deprecated"
wasmtime = { version = "39.0.1", features = ["component-model-async"] }
wasmtime-wasi = "39.0.1"
wit-bindgen = "0.49.0"
ntx-network = { path = "network", features= ["host"]}
once_cell = "1.21.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2.4"
chrono = "0.4.42"
indexmap = "2.12.1"
thiserror = "2.0.11"
parking_lot = "0.12.5"
bytes = "1.11.0"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.39", features = ["full"] }


[features]
# By default, keep the root crate buildable without requiring optional plugin WIT
# directories (e.g. `plugins/scheduler/wit/core`) to exist.
default = []

# Enable WASM scheduler component integration (wasmtime component bindgen + runner).
scheduler-component = []

# Enable experimental TCP client mode in the root binary.
tcp-client = []

# Internal: expose limited `ComponentEngine` internals (store + typed bindings)
# to integration tests that need to invoke component imports.
wasm-engine-test-access = []

[[example]]
name = "ntx-echo-client"
path = "examples/ntx-echo/client.rs"

[[example]]
name = "ntx-echo-server"
path = "examples/ntx-echo/server.rs"

[[example]]
name = "wasm-engine-demo"
path = "examples/wasm_engine_demo.rs"

[[example]]
name = "packet-engine-run"
path = "examples/packet_engine_run.rs"
